name: Atualizar Terminal Diário com IA

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install google-genai

      - name: Executar Script de Atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python updater.py

      - name: Commit e Push automático das alterações
        run: |
          git config --global user.name "Robô Terminal Leite"
          git config --global user.email "actions@github.com"
          git add public/data/liveData.json
          git diff --cached --quiet || git commit -m "🤖 Update automático diário do terminal: $(date +'%Y-%m-%d')"
          git push
