name: Atualizar Terminal Diário com IA

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install google-generativeai

      - name: Executar Script de Atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python updater.py

      - name: Commit e Push automático das alterações
        run: |
          git config --global user.name "Robô Terminal Leite"
          git config --global user.email "robo@terminalleite.internal"
          git add src/data/liveData.json
          git commit -m "🤖 Update automático diário do terminal: $(date +'%Y-%m-%d')" || exit 0
          git push
